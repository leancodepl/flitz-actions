name: Publish with Flitz
description: Build the project's app with flitz publish and expose the publish id and URLs.

inputs:
  api-key:
    description: The organization API key, from a repository secret. Passed only to the step that runs flitz publish.
    required: true
  flitz-path:
    description: The project's pin file. Relative to the workspace root; flitz publish runs from its directory.
    required: false
    default: flitz.yaml
  dir:
    description: The Flutter app directory, forwarded as --dir. Relative to the workspace root. Empty builds the app at the pin file's directory.
    required: false
    default: ""
  target:
    description: The Dart entry-point file, relative to the app directory, forwarded as --target. Empty builds lib/main.dart.
    required: false
    default: ""
  app:
    description: The app key, forwarded as --app. Empty uses flitz.yaml app:, then the pubspec name.
    required: false
    default: ""
  track:
    description: The track, forwarded as --track. Empty uses the pull request's source branch on a pull request, else the ref name. Always overrides flitz.yaml track:. Trimmed to 255 characters.
    required: false
    default: ""
  dart-define:
    description: Compile-time constants, one KEY=VALUE per line, each forwarded as one --dart-define.
    required: false
    default: ""
  dart-define-from-file:
    description: Constant files (.json or .env), one path per line, each forwarded as one --dart-define-from-file. Relative to the workspace root.
    required: false
    default: ""
  schema:
    description: The deeplink URL scheme, forwarded as --schema. Empty uses flitz.yaml schema:, then flitz.
    required: false
    default: ""
  name:
    description: Display title for the publish, forwarded as --name. Empty uses "PR #<number>: <title>" on a pull request, else the ref name. Trimmed to 120 characters.
    required: false
    default: ""
  version-name:
    description: Version label for the publish, forwarded as --version-name. Empty uses pr-<number>-<short sha> on a pull request, else <ref>-<short sha>. Trimmed to 64 characters.
    required: false
    default: ""
  comment:
    description: Free-text comment for the publish, forwarded as --comment. Empty uses the repository and pull request number with its branches (on a pull request), else the repository and ref with the pushed commit's subject; then the short commit and the actor. Trimmed to 1000 characters.
    required: false
    default: ""

outputs:
  id:
    description: The publish record's opaque id.
    value: ${{ steps.result.outputs.id }}
  page-url:
    description: The landing page's download URL.
    value: ${{ steps.result.outputs.page-url }}
  deeplink:
    description: The <schema>://download?url=… deeplink the landing page and the QR encode.
    value: ${{ steps.result.outputs.deeplink }}
  bundle-url:
    description: The .flitz bundle's download URL.
    value: ${{ steps.result.outputs.bundle-url }}
  app-key:
    description: The key of the app the publish belongs to.
    value: ${{ steps.result.outputs.app-key }}
  app-name:
    description: The display name of the app the publish belongs to.
    value: ${{ steps.result.outputs.app-name }}
  track-key:
    description: The key of the track the publish belongs to.
    value: ${{ steps.result.outputs.track-key }}
  track-name:
    description: The display name of the track the publish belongs to.
    value: ${{ steps.result.outputs.track-name }}
  track-url:
    description: The track's page, which always offers the track's latest publish.
    value: ${{ steps.result.outputs.track-url }}

runs:
  using: composite
  steps:
    - name: Detect host
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../scripts/detect-host.sh"

    - name: Require the flitz CLI
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../scripts/require-cli.sh"

    - name: Resolve the pin
      id: pin
      shell: bash
      env:
        FLITZ_PATH: ${{ inputs.flitz-path }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/find-pin.sh"

    - name: Check credential
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/check-credential.sh"

    - name: Publish
      id: publish
      shell: bash
      working-directory: ${{ steps.pin.outputs.dir }}
      env:
        FLITZ: flitz
        FLITZ_APIKEY: ${{ inputs.api-key }}
        DIR: ${{ inputs.dir }}
        TARGET: ${{ inputs.target }}
        APP: ${{ inputs.app }}
        TRACK: ${{ inputs.track }}
        DART_DEFINES: ${{ inputs.dart-define }}
        DART_DEFINE_FILES: ${{ inputs.dart-define-from-file }}
        SCHEMA: ${{ inputs.schema }}
        NAME: ${{ inputs.name }}
        VERSION_NAME: ${{ inputs.version-name }}
        COMMENT: ${{ inputs.comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/publish.sh"

    - name: Expose the result
      id: result
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/publish-result.sh"
