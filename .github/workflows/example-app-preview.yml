name: Example app Flitz preview

# Publishes a Flitz bundle of example_app for the PR and links it from a PR
# comment. It runs the combined action from this checkout (`uses: ./`), so a PR
# that changes an action is tested against its own copy of it.

on:
  pull_request:
    branches: [main]
    paths:
      - 'example_app/**'
      - 'action.yml'
      - 'install*/**'
      - 'publish/**'
      - 'pr-comment/**'
      - '.github/workflows/example-app-preview.yml'

concurrency:
  group: example-app-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: Publish preview
    # The Flitz toolchain is published for linux-x64 and macos-arm64 only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs have no access to FLITZ_APIKEY.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      # `flitz publish` rejects over-long metadata and the action does not trim
      # it (--name <= 120, --version-name <= 64, --comment <= 1000 characters),
      # and a PR title has no cap, so the values are built and trimmed here.
      - name: Publish metadata
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          name="PR #${PR_NUMBER}: ${PR_TITLE}"
          comment="${PR_URL} | ${HEAD_REF} @ ${HEAD_SHA} | ${RUN_URL}"
          {
            echo "name<<EOF"
            echo "${name:0:120}"
            echo "EOF"
            echo "version-name=pr-${PR_NUMBER}-${HEAD_SHA:0:7}"
            echo "comment<<EOF"
            echo "${comment:0:1000}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Installs the CLI and the SDK pinned in example_app/flitz.yaml, caches
      # the SDK and the pub cache, runs `flitz publish` from example_app/, and
      # posts the PR comment, replacing its previous copy.
      - name: Publish preview
        uses: ./
        with:
          flitz-path: example_app/flitz.yaml
          api-key: ${{ secrets.FLITZ_APIKEY }}
          name: ${{ steps.meta.outputs.name }}
          version-name: ${{ steps.meta.outputs.version-name }}
          comment: ${{ steps.meta.outputs.comment }}
          pr-comment-header: 📱 Flitz preview build
          pr-comment-message: Open it with a Flitz-enabled loader build.
