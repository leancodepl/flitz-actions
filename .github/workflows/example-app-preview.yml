name: Example app Flitz preview

# Publishes a Flitz bundle of example_app for the PR and links it from a PR
# comment. It runs the combined action from this checkout (`uses: ./`), so a PR
# that changes an action is tested against its own copy of it.

on:
  pull_request:
    branches: [main]
    paths:
      - 'example_app/**'
      - 'action.yml'
      - 'install*/**'
      - 'publish/**'
      - 'pr-comment/**'
      - '.github/workflows/example-app-preview.yml'

concurrency:
  group: example-app-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: Publish preview
    # The Flitz toolchain is published for linux-x64 and macos-arm64 only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs have no access to FLITZ_APIKEY.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      # Installs the CLI and the SDK pinned in example_app/flitz.yaml, caches
      # the SDK and the pub cache, runs `flitz publish` from example_app/, and
      # posts the PR comment, replacing its previous copy.
      - name: Publish preview
        uses: ./
        with:
          flitz-path: example_app/flitz.yaml
          api-key: ${{ secrets.FLITZ_APIKEY }}
          # The action trims name, version-name, and comment to the CLI's caps.
          name: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          version-name: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          comment: ${{ github.event.pull_request.html_url }} | ${{ github.event.pull_request.head.ref }} @ ${{ github.event.pull_request.head.sha }} | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
