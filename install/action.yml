name: Install Flitz
description: Install the flitz CLI and the project's pinned Flitz SDK, and restore the pub cache.

# The steps below repeat those of install-cli/action.yml and install-sdk/action.yml rather than
# referencing them with a relative `uses:`. A relative local action inside a composite action is
# resolved against the caller's workspace, which does not contain this repository when the action is
# consumed from another repo. GITHUB_ACTION_PATH does point into this repository, so each step runs
# its script from scripts/, which those actions share.

inputs:
  cli-version:
    description: A CLI semantic version (0.1.0, 1.5.0-rc.1), or `latest`.
    required: false
    default: latest
  base-url:
    description: The public download host serving the CLI artifacts.
    required: false
    default: https://download.flitz.dev
  flitz-path:
    description: The project's pin file, naming the SDK tag to install and the project directory. Relative to the workspace root.
    required: false
    default: flitz.yaml
  api-key:
    description: The organization API key, from a repository secret. Passed only to the step that runs flitz sdk install.
    required: true
  cache:
    description: Whether to restore and save the SDK cache.
    required: false
    default: "true"
  pub-cache:
    description: Whether to restore and save the pub dependency cache.
    required: false
    default: "true"

outputs:
  cli-version:
    description: The concrete CLI version installed, with `latest` already resolved.
    value: ${{ steps.resolve-cli.outputs.version }}
  flitz-version:
    description: The resolved Flitz release tag.
    value: ${{ steps.resolve-sdk.outputs.version }}
  sdk-path:
    description: The absolute path of the installed SDK root — a valid FLUTTER_ROOT.
    value: ${{ steps.sdkpath.outputs.path }}
  sdk-cache-hit:
    description: Whether the SDK cache was restored.
    value: ${{ steps.cache.outputs.cache-hit == 'true' }}

runs:
  using: composite
  steps:
    - name: Detect host
      id: host
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../scripts/detect-host.sh"

    - name: Resolve the pin
      id: resolve-sdk
      shell: bash
      env:
        FLITZ_PATH: ${{ inputs.flitz-path }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../scripts/find-pin.sh"
        bash "${GITHUB_ACTION_PATH}/../scripts/read-pin.sh"

    - name: Check credential
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/check-credential.sh"

    - name: Resolve release
      id: resolve-cli
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        BASE_URL: ${{ inputs.base-url }}
        HOST: ${{ steps.host.outputs.host }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/resolve-cli.sh"

    - name: Install the CLI
      id: install-cli
      shell: bash
      env:
        URL: ${{ steps.resolve-cli.outputs.url }}
        EXPECTED_SHA256: ${{ steps.resolve-cli.outputs.sha256 }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/install-cli.sh"

    - name: Verify installed version
      shell: bash
      env:
        FLITZ: ${{ steps.install-cli.outputs.path }}
        EXPECTED: ${{ steps.resolve-cli.outputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/verify-cli.sh"

    - name: Derive the SDK path
      id: sdkpath
      shell: bash
      env:
        TAG: ${{ steps.resolve-sdk.outputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/sdk-path.sh"

    - name: Restore the SDK cache
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.sdkpath.outputs.path }}
        key: flitz-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-sdk.outputs.version }}

    - name: Install the SDK
      shell: bash
      env:
        FLITZ: ${{ steps.install-cli.outputs.path }}
        TAG: ${{ steps.resolve-sdk.outputs.version }}
        FLITZ_APIKEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        "$FLITZ" sdk install "$TAG"

    - name: Expose the toolchain
      shell: bash
      env:
        SDK_PATH: ${{ steps.sdkpath.outputs.path }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/expose-toolchain.sh"

    - name: Scope the pub cache
      id: pubscope
      if: inputs.pub-cache == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.resolve-sdk.outputs.dir }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/pub-cache-scope.sh"

    - name: Cache pub dependencies
      if: steps.pubscope.outputs.key != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.pubscope.outputs.path }}
        key: ${{ steps.pubscope.outputs.key }}
        restore-keys: |
          pub-${{ runner.os }}-${{ runner.arch }}-
