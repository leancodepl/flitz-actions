name: Comment a Flitz preview
description: Post the publish's landing page, deeplink, and bundle as a comment on the triggering pull request.

inputs:
  page-url:
    description: The landing page URL — the page-url output of the publish action.
    required: true
  deeplink:
    description: The deeplink — the deeplink output of the publish action.
    required: false
    default: ""
  bundle-url:
    description: The bundle URL — the bundle-url output of the publish action.
    required: false
    default: ""
  track-name:
    description: The track's display name — the track-name output of the publish action.
    required: false
    default: ""
  track-url:
    description: The track's page — the track-url output of the publish action.
    required: false
    default: ""
  id:
    description: The publish id — the id output of the publish action.
    required: false
    default: ""
  key:
    description: Identifies the comment among the Flitz comments on one pull request. Letters, digits, '.', '_', or '-'.
    required: false
    default: default
  header:
    description: The comment's heading text.
    required: false
    default: 📱 Flitz preview build
  message:
    description: Markdown inserted below the landing-page link, e.g. which loader build opens the bundle. Empty omits it.
    required: false
    default: Open it with a Flitz-enabled loader build.
  github-token:
    description: The token the comment is posted and cleaned up with. Needs pull-requests write permission.
    required: false
    default: ${{ github.token }}

outputs:
  comment-url:
    description: The HTML URL of the posted comment. Empty when the event is not a pull request.
    value: ${{ steps.post.outputs.comment-url }}

runs:
  using: composite
  steps:
    - name: Note the missing pull request
      if: ${{ !github.event.pull_request }}
      shell: bash
      run: echo "::notice::the ${GITHUB_EVENT_NAME} event is not a pull request; no Flitz preview comment was posted"

    - name: Validate
      if: github.event.pull_request
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/pr-validate.sh"

    - name: Render the comment
      id: render
      if: github.event.pull_request
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        HEADER: ${{ inputs.header }}
        PAGE_URL: ${{ inputs.page-url }}
        MESSAGE: ${{ inputs.message }}
        DEEPLINK: ${{ inputs.deeplink }}
        BUNDLE_URL: ${{ inputs.bundle-url }}
        TRACK_NAME: ${{ inputs.track-name }}
        TRACK_URL: ${{ inputs.track-url }}
        ID: ${{ inputs.id }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/pr-render.sh"

    - name: Post the comment
      id: post
      if: github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ github.event.pull_request.number }}
        BODY: ${{ steps.render.outputs.path }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/pr-post.sh"

    - name: Remove older comments
      if: github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ github.event.pull_request.number }}
        KEY: ${{ inputs.key }}
        NEW_ID: ${{ steps.post.outputs.id }}
        AUTHOR: ${{ steps.post.outputs.author }}
      run: bash "${GITHUB_ACTION_PATH}/../scripts/pr-cleanup.sh"
