name: Flitz
description: Install the flitz CLI and the pinned Flitz SDK, build and publish the app, and link it from the pull request.

# The steps below repeat those of install/action.yml, publish/action.yml, and pr-comment/action.yml
# rather than referencing them with a relative `uses:`. A relative local action inside a composite
# action is resolved against the caller's workspace, which does not contain this repository when the
# action is consumed from another repo. GITHUB_ACTION_PATH does point into this repository, so each
# step runs its script from scripts/, which those actions share.

inputs:
  cli-version:
    description: A CLI semantic version (0.1.0, 1.5.0-rc.1), or `latest`.
    required: false
    default: latest
  base-url:
    description: The public download host serving the CLI artifacts.
    required: false
    default: https://download.flitz.dev
  flitz-path:
    description: The project's pin file, naming the SDK tag to install and the project to publish. Relative to the workspace root.
    required: false
    default: flitz.yaml
  api-key:
    description: The organization API key, from a repository secret. Passed only to the steps that run flitz.
    required: true
  cache:
    description: Whether to restore and save the SDK cache.
    required: false
    default: "true"
  pub-cache:
    description: Whether to restore and save the pub dependency cache.
    required: false
    default: "true"
  app:
    description: The Flutter application directory, forwarded as --app. Empty builds the app at the pin file's directory.
    required: false
    default: ""
  target:
    description: The Dart entry-point file, relative to the app directory, forwarded as --target. Empty builds lib/main.dart.
    required: false
    default: ""
  target-platform:
    description: Forwarded as --target-platform. Empty uses the CLI's default for the build host.
    required: false
    default: ""
  dart-define:
    description: Compile-time constants, one KEY=VALUE per line, each forwarded as one --dart-define.
    required: false
    default: ""
  dart-define-from-file:
    description: Constant files (.json or .env), one path per line, each forwarded as one --dart-define-from-file. Relative to the workspace root.
    required: false
    default: ""
  schema:
    description: The deeplink URL scheme, forwarded as --schema. Empty uses the CLI's default, flitz.
    required: false
    default: ""
  name:
    description: Display title for the publish, forwarded as --name. Empty uses "PR #<number>: <title>" on a pull request, else the ref name. Trimmed to 120 characters.
    required: false
    default: ""
  version-name:
    description: Version label for the publish, forwarded as --version-name. Empty uses pr-<number>-<short sha> on a pull request, else <ref>-<short sha>. Trimmed to 64 characters.
    required: false
    default: ""
  comment:
    description: Free-text comment for the publish, forwarded as --comment. Empty uses the pull-request URL (on a pull request), the ref and commit, and the run URL. Trimmed to 1000 characters.
    required: false
    default: ""
  pr-comment-key:
    description: Identifies the pull-request comment among the Flitz comments on one pull request. Letters, digits, '.', '_', or '-'.
    required: false
    default: default
  pr-comment-header:
    description: The pull-request comment's heading text.
    required: false
    default: 📱 Flitz preview build
  pr-comment-message:
    description: Markdown inserted below the landing-page link in the pull-request comment. Empty omits it.
    required: false
    default: Open it with a Flitz-enabled loader build.
  github-token:
    description: The token the pull-request comment is posted and cleaned up with. Needs pull-requests write permission.
    required: false
    default: ${{ github.token }}

outputs:
  cli-version:
    description: The concrete CLI version installed, with `latest` already resolved.
    value: ${{ steps.resolve-cli.outputs.version }}
  flitz-version:
    description: The resolved Flitz release tag.
    value: ${{ steps.resolve-sdk.outputs.version }}
  sdk-path:
    description: The absolute path of the installed SDK root — a valid FLUTTER_ROOT.
    value: ${{ steps.sdkpath.outputs.path }}
  sdk-cache-hit:
    description: Whether the SDK cache was restored.
    value: ${{ steps.cache.outputs.cache-hit == 'true' }}
  id:
    description: The publish record's opaque id.
    value: ${{ steps.result.outputs.id }}
  page-url:
    description: The landing page's download URL.
    value: ${{ steps.result.outputs.page-url }}
  deeplink:
    description: The <schema>://download?url=… deeplink the landing page and the QR encode.
    value: ${{ steps.result.outputs.deeplink }}
  bundle-url:
    description: The .flitz bundle's download URL.
    value: ${{ steps.result.outputs.bundle-url }}
  comment-url:
    description: The HTML URL of the pull-request comment. Empty when the event is not a pull request.
    value: ${{ steps.post.outputs.comment-url }}

runs:
  using: composite
  steps:
    - name: Detect host
      id: host
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/detect-host.sh"

    - name: Resolve the pin
      id: resolve-sdk
      shell: bash
      env:
        FLITZ_PATH: ${{ inputs.flitz-path }}
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/find-pin.sh"
        bash "${GITHUB_ACTION_PATH}/scripts/read-pin.sh"

    - name: Check credential
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/check-credential.sh"

    - name: Resolve release
      id: resolve-cli
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        BASE_URL: ${{ inputs.base-url }}
        HOST: ${{ steps.host.outputs.host }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/resolve-cli.sh"

    - name: Install the CLI
      id: install-cli
      shell: bash
      env:
        URL: ${{ steps.resolve-cli.outputs.url }}
        EXPECTED_SHA256: ${{ steps.resolve-cli.outputs.sha256 }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install-cli.sh"

    - name: Verify installed version
      shell: bash
      env:
        FLITZ: ${{ steps.install-cli.outputs.path }}
        EXPECTED: ${{ steps.resolve-cli.outputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/verify-cli.sh"

    - name: Derive the SDK path
      id: sdkpath
      shell: bash
      env:
        TAG: ${{ steps.resolve-sdk.outputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/sdk-path.sh"

    - name: Restore the SDK cache
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.sdkpath.outputs.path }}
        key: flitz-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-sdk.outputs.version }}

    - name: Install the SDK
      shell: bash
      env:
        FLITZ: ${{ steps.install-cli.outputs.path }}
        TAG: ${{ steps.resolve-sdk.outputs.version }}
        FLITZ_APIKEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        "$FLITZ" sdk install "$TAG"

    - name: Expose the toolchain
      shell: bash
      env:
        SDK_PATH: ${{ steps.sdkpath.outputs.path }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/expose-toolchain.sh"

    - name: Scope the pub cache
      id: pubscope
      if: inputs.pub-cache == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.resolve-sdk.outputs.dir }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/pub-cache-scope.sh"

    - name: Cache pub dependencies
      if: steps.pubscope.outputs.key != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.pubscope.outputs.path }}
        key: ${{ steps.pubscope.outputs.key }}
        restore-keys: |
          pub-${{ runner.os }}-${{ runner.arch }}-

    - name: Publish
      id: publish
      shell: bash
      working-directory: ${{ steps.resolve-sdk.outputs.dir }}
      env:
        FLITZ: ${{ steps.install-cli.outputs.path }}
        FLITZ_APIKEY: ${{ inputs.api-key }}
        APP: ${{ inputs.app }}
        TARGET: ${{ inputs.target }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        DART_DEFINES: ${{ inputs.dart-define }}
        DART_DEFINE_FILES: ${{ inputs.dart-define-from-file }}
        SCHEMA: ${{ inputs.schema }}
        NAME: ${{ inputs.name }}
        VERSION_NAME: ${{ inputs.version-name }}
        COMMENT: ${{ inputs.comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish.sh"

    - name: Expose the result
      id: result
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-result.sh"

    - name: Note the missing pull request
      if: ${{ !github.event.pull_request }}
      shell: bash
      run: echo "::notice::the ${GITHUB_EVENT_NAME} event is not a pull request; no Flitz preview comment was posted"

    - name: Validate
      if: github.event.pull_request
      shell: bash
      env:
        KEY: ${{ inputs.pr-comment-key }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/pr-validate.sh"

    - name: Render the comment
      id: render
      if: github.event.pull_request
      shell: bash
      env:
        KEY: ${{ inputs.pr-comment-key }}
        HEADER: ${{ inputs.pr-comment-header }}
        PAGE_URL: ${{ steps.result.outputs.page-url }}
        MESSAGE: ${{ inputs.pr-comment-message }}
        DEEPLINK: ${{ steps.result.outputs.deeplink }}
        BUNDLE_URL: ${{ steps.result.outputs.bundle-url }}
        ID: ${{ steps.result.outputs.id }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/pr-render.sh"

    - name: Post the comment
      id: post
      if: github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ github.event.pull_request.number }}
        BODY: ${{ steps.render.outputs.path }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/pr-post.sh"

    - name: Remove older comments
      if: github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ github.event.pull_request.number }}
        KEY: ${{ inputs.pr-comment-key }}
        NEW_ID: ${{ steps.post.outputs.id }}
        AUTHOR: ${{ steps.post.outputs.author }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/pr-cleanup.sh"
